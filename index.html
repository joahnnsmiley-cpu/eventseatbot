<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>НиктоНеКруче — билеты</title>
  <script>
    // Debug overlay — shows JS errors in VK WebView where DevTools are unavailable.
    // Opt-in only: append ?debug=1 to the URL. Never shown to guests in production.
    (function () {
      if (!/[?&]debug=1(&|$)/.test(window.location.search)) return;
      var write = function (text) {
        var el = document.getElementById('__dbg');
        if (!el) return;
        el.style.display = 'block';
        el.innerText += '\n' + text;
      };
      window.__dbg = write;
      window.addEventListener('error', function (e) {
        write('ERROR: ' + e.message + '\nat ' + e.filename + ':' + e.lineno);
      });
      window.addEventListener('unhandledrejection', function (e) {
        write('PROMISE REJECT: ' + (e.reason || e));
      });
      write('HTML loaded OK');
    })();
  </script>
</head>

<body style="background-color:#0B0A09;margin:0;">
  <div id="__dbg"
    style="display:none;position:fixed;top:0;left:0;right:0;background:#c00;color:#fff;font-size:12px;padding:8px;z-index:99999;white-space:pre-wrap;word-break:break-all;max-height:50vh;overflow:auto;">
  </div>
  <div id="root"></div>
  <script>
    // Load Telegram SDK only when NOT running inside VK Mini Apps.
    // VK's webview cannot reach telegram.org — the request times out and
    // triggers VK's "Ошибка загрузки" error screen.
    //
    // Stays async so VK is never blocked; index.tsx waits for window.Telegram
    // (with a timeout) before the first render, so nothing reads a missing SDK.
    if (!window.location.href.includes('vk_user_id') && !window.location.href.includes('vk_app_id')) {
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://telegram.org/js/telegram-web-app.js';
      document.head.appendChild(s);
    }
  </script>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
